<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Cosplay Planner</title>
  <desc id="logo-description">Фиолетовая монограмма c и p с лисьими ушками</desc>
  <defs>
    <linearGradient id="violet" x1="92" y1="72" x2="414" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CFF"/>
      <stop offset="0.52" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#4B42D8"/>
    </linearGradient>
    <linearGradient id="inner-ear" x1="156" y1="85" x2="345" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8E4FF"/>
      <stop offset="1" stop-color="#B8C8FF"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4438B8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Fox ears, shaped as a calm crown above the monogram. -->
    <path d="M107 198 151 61c5-15 25-18 35-6l76 91-45 73Z" fill="url(#violet)"/>
    <path d="m250 148 78-93c10-12 30-8 35 7l43 139-113 17Z" fill="url(#violet)"/>
    <path d="m143 163 24-72 45 75-25 22Z" fill="url(#inner-ear)"/>
    <path d="m299 166 47-75 23 75-58 22Z" fill="url(#inner-ear)"/>

    <!-- Lowercase c. -->
    <path
      d="M225 243c-13-21-31-33-57-33-53 0-92 45-92 105s39 106 92 106c27 0 46-12 60-36"
      fill="none"
      stroke="url(#violet)"
      stroke-width="54"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lowercase p, sharing the center of the fox mark with c. -->
    <path
      d="M292 447V224m1 90c0-57 29-103 72-103 44 0 73 41 73 102 0 62-29 105-74 105-43 0-71-44-71-104Z"
      fill="none"
      stroke="url(#violet)"
      stroke-width="54"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- A small crystal glint ties the mark back to the original fox icon. -->
    <path d="m257 105 7 18 18 7-18 7-7 18-7-18-18-7 18-7Z" fill="#FFFFFF" opacity="0.94"/>
  </g>
</svg>
