{% extends 'base.html' %}{% block content %}<section class="section-head"><div><h1>{{ 'Редактирование курса' if course else 'Новый курс' }}</h1><p class="meta">Карточки уроков и доступ участников</p></div><a class="btn" href="{{ '/courses/' ~ course.id if course else '/courses' }}">Отмена</a></section><form method="post" class="grid one-col big-form course-form"><section class="card"><div class="grid two-col"><label>Название<input name="title" required value="{{ course.title if course else '' }}"></label><label>Обложка<input name="cover_url" value="{{ course.cover_url if course else '' }}" placeholder="/media/... или https://..."></label><label>Статус<select name="status">{% for value,label in statuses.items() %}<option value="{{ value }}" {% if course and course.status==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Доступ<select name="access_mode" data-course-access>{% for value,label in access_modes.items() %}<option value="{{ value }}" {% if course and course.access_mode==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label data-course-code>Кодовое слово<input name="access_code" placeholder="Оставьте пустым, чтобы не менять"></label></div><label>Описание<textarea name="description" rows="8">{{ course.description if course else '' }}</textarea></label></section><button class="btn btn-accent" type="submit">Сохранить курс</button></form><script>document.querySelector('[data-course-access]')?.addEventListener('change',function(){document.querySelector('[data-course-code]').hidden=this.value!=='code'});document.querySelector('[data-course-access]')?.dispatchEvent(new Event('change'));</script>{% endblock %}
