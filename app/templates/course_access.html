{% extends 'base.html' %}{% block content %}<section class="card course-access-card"><h1>{{ course.title }}</h1><p>{{ course.description or '' }}</p>{% if course.access_mode=='code' %}<form method="post" action="/courses/{{ course.id }}/join" class="grid one-col"><label>Кодовое слово<input type="password" name="access_code" required></label><button class="btn btn-accent" type="submit">Открыть курс</button></form>{% else %}<p class="meta">Доступ к курсу выдаёт его создатель.</p>{% endif %}<a class="btn" href="/courses">Назад к курсам</a></section>{% endblock %}
