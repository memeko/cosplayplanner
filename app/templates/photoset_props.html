{% extends 'base.html' %}{% block content %}<section class="section-head"><div><h1>Реквизит · {{ item.title }}</h1><p class="meta">Название, стоимость и изображение</p></div><a class="btn" href="/cosplan/photosets/{{ item.id }}">К обзору</a></section>{% include '_photoset_tabs.html' %}<form method="post" class="card repeat-editor"><div data-simple-rows>{% for row in props %}<div class="repeat-row prop-row"><input name="name" value="{{ row.name }}" placeholder="Название"><input type="number" min="0" step=".01" name="price" value="{{ row.price }}" placeholder="Цена"><input name="image_url" value="{{ row.image_url }}" placeholder="Ссылка на картинку или /media/..."><button class="btn" type="button" data-remove>Удалить</button>{% if row.image_url %}<img class="reference-thumb" src="{{ row.image_url }}" alt="{{ row.name }}">{% endif %}</div>{% endfor %}</div><button class="btn" type="button" data-add-simple>+ Строка</button><button class="btn btn-accent" type="submit">Сохранить</button></form><template id="simple-row"><div class="repeat-row prop-row"><input name="name" placeholder="Название"><input type="number" min="0" step=".01" name="price" placeholder="Цена"><input name="image_url" placeholder="Ссылка на картинку или /media/..."><button class="btn" type="button" data-remove>Удалить</button></div></template><script src="/static/photoset_sections.js"></script>{% endblock %}
