{% extends 'base.html' %}{% block content %}
<section class="section-head"><div><h1>Ссылки · {{ item.title }}</h1><p class="meta">Отбор и готовые материалы для каждого участника команды</p></div><a class="btn" href="/cosplan/photosets/{{ item.id }}">К обзору</a></section>
{% include '_photoset_tabs.html' %}
<form method="post" class="card repeat-editor links-editor"><div class="photoset-table-scroll"><table class="photoset-data-table"><thead><tr><th>Роль</th><th>Ник</th><th>Соцсеть</th><th>Ссылка на отбор</th><th>Готовая папка</th><th></th></tr></thead><tbody data-link-rows>{% for row in rows %}<tr><td><input name="link_role" value="{{ row.role }}" placeholder="Роль"></td><td><input name="link_nickname" value="{{ row.nickname }}" placeholder="@ник"></td><td><input name="link_social" value="{{ row.social }}" placeholder="Ссылка или @аккаунт"></td><td><input type="url" name="link_selection_url" value="{{ row.selection_url }}" placeholder="https://..."></td><td><input type="url" name="link_ready_url" value="{{ row.ready_url }}" placeholder="https://..."></td><td><button class="btn" type="button" data-remove-link>Удалить</button></td></tr>{% endfor %}</tbody></table></div><div class="actions-inline"><button class="btn" type="button" data-add-link>+ Строка</button><button class="btn btn-accent" type="submit">Сохранить ссылки</button></div></form>
<template id="link-row-template"><tr><td><input name="link_role" placeholder="Роль"></td><td><input name="link_nickname" placeholder="@ник"></td><td><input name="link_social" placeholder="Ссылка или @аккаунт"></td><td><input type="url" name="link_selection_url" placeholder="https://..."></td><td><input type="url" name="link_ready_url" placeholder="https://..."></td><td><button class="btn" type="button" data-remove-link>Удалить</button></td></tr></template>
<script src="/static/photoset_links.js"></script>{% endblock %}
