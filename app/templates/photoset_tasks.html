{% extends 'base.html' %}{% block content %}<section class="section-head"><div><h1>Список дел · {{ item.title }}</h1><p class="meta">Эти пункты отображаются в разделе «В работе» → «Все дела»</p></div><a class="btn" href="/in-progress?view=kanban">Открыть канбан</a></section>{% include '_photoset_tabs.html' %}<form method="post" class="card repeat-editor"><div data-simple-rows>{% for row in tasks %}<div class="repeat-row task-row"><input name="task_text" value="{{ row.text }}" placeholder="Что сделать"><select name="task_status">{% for value,label in status_labels.items() %}<option value="{{ value }}" {% if row.status==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><input type="date" name="task_deadline" value="{{ row.deadline or '' }}"><button class="btn" type="button" data-remove>Удалить</button></div>{% endfor %}</div><button class="btn" type="button" data-add-simple>+ Дело</button><button class="btn btn-accent" type="submit">Сохранить список</button></form><template id="simple-row"><div class="repeat-row task-row"><input name="task_text" placeholder="Что сделать"><select name="task_status">{% for value,label in status_labels.items() %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><input type="date" name="task_deadline"><button class="btn" type="button" data-remove>Удалить</button></div></template><script src="/static/photoset_sections.js"></script>{% endblock %}
